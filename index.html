
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Password Strength Checker</h2>

        <div class="input-box">
            <input 
                type="password" 
                id="password"
                placeholder="Enter your password"
            >

            <button id="togglePassword">Show</button>
        </div>

        <div class="strength-box">
            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <p id="strengthText">Password Strength: Not entered</p>
        </div>

        <div class="requirements">
            <p id="length" >✗ At least 8 characters</p>
            <p id="uppercase" >✗ One uppercase letter</p>
            <p id="lowercase" >✗ One lowercase letter</p>
            <p id="number" >✗ One number</p>
            <p id="special" >✗ One special character</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
